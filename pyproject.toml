[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sndeck"
version = "0.1.0"
description = "Zero-token ServiceNow workbench TUI (sndeck)"
requires-python = ">=3.11"
dependencies = ["textual[syntax]>=8.0.2", "httpx>=0.27", "keyring>=25", "watchfiles>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
sndeck = "sndeck.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sndeck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
